descripcion: 'Estructura de la base: tablas, columnas, joins y dimensiones. Las métricas están en medidas.yaml. Los tipos
  se extrajeron de la base y el resto se escribe a mano. Los valores válidos y los rangos los lee el procesador de la
  base al arrancar («de la base»), para que los datos nuevos entren sin tocar este archivo (decisión 62).'
tablas:
  fechas:
    tipo: dimension
    alias: f
    grano: ''
    join: ''
    descripcion: 'Calendario: un día por fila. Tiene que cubrir todas las fechas de ventas, stock y presupuesto (lo controla verificar_base.py). La primera y la última semana pueden estar incompletas (ver semana_inicio). Al armar la base cubría del 01-05-2024 al 30-04-2026 (AF2025 y AF2026).'
    columnas:
      fecha:
        tipo: DATE
        rango: de la base
        descripcion: 'El día.'
        une_con: ''
      anio:
        tipo: INTEGER
        rango: de la base
        descripcion: 'Año calendario.'
        une_con: ''
      mes:
        tipo: INTEGER
        rango: de la base
        descripcion: 'Mes calendario (1 = enero).'
        une_con: ''
      dia:
        tipo: INTEGER
        rango: de la base
        descripcion: 'Día del mes.'
        une_con: ''
      nombre_mes:
        tipo: VARCHAR
        valores: de la base
        descripcion: 'Nombre del mes en minúscula (''enero''…).'
        une_con: ''
      dia_semana:
        tipo: INTEGER
        rango: de la base
        descripcion: '1 = lunes … 7 = domingo.'
        une_con: ''
      anio_fiscal:
        tipo: BIGINT
        rango: de la base
        descripcion: 'Año fiscal, va de mayo a abril y lleva el nombre del año en que termina (AF2026 = may-2025 a abr-2026).'
        une_con: ''
      mes_fiscal:
        tipo: BIGINT
        rango: de la base
        descripcion: '1 = mayo … 12 = abril.'
        une_con: ''
      trimestre_fiscal:
        tipo: BIGINT
        rango: de la base
        descripcion: 'T1 may–jul, T2 ago–oct, T3 nov–ene, T4 feb–abr.'
        une_con: ''
      semana_inicio:
        tipo: DATE
        rango: de la base
        descripcion: 'Lunes de esa semana. La primera y la última semana de la base pueden tener menos de 7 días (al armarla: la primera, 29-04-2024, tenía 5; la última, 27-04-2026, 4): al comparar por semana, excluirlas o aclararlo, porque parecen caídas.'
        une_con: ''
  presupuesto:
    tipo: hecho
    alias: pz
    grano: mes x sucursal x categoría
    join: presupuesto pz JOIN fechas f ON pz.mes = f.fecha JOIN sucursales s ON pz.sucursal_id = s.sucursal_id
    dimensiones_propias:  # para esta tabla, estas dimensiones van a su propia columna y no a la del mapa general
      categoria: pz.categoria
    descripcion: 'Objetivo mensual de ventas netas por sucursal y categoría. S39 y S40 tienen presupuesto desde su mes de apertura. Error de carga conocido: ene-2026, Perfumería, región Sur (10 filas), el importe viene 10 veces más alto.'
    columnas:
      mes:
        tipo: DATE
        rango: de la base
        descripcion: 'Primer día del mes presupuestado.'
        une_con: ''
      sucursal_id:
        tipo: VARCHAR
        distintos: 40
        descripcion: 'Sucursal (código S01, S02…).'
        une_con: ''
      categoria:
        tipo: VARCHAR
        valores: de la base
        descripcion: 'Una de 6. No hay sku: se cruza con productos solo por este texto.'
        une_con: ''
      importe_presupuesto:
        tipo: DOUBLE
        rango: de la base
        descripcion: 'Venta neta objetivo, en ARS.'
        une_con: ''
  productos:
    tipo: dimension
    alias: p
    grano: ''
    join: ''
    descripcion: 'Maestro de productos: uno por fila (308), 6 categorías y 27 subcategorías.'
    columnas:
      sku:
        tipo: VARCHAR
        distintos: 308
        descripcion: 'Código del producto (P0001…).'
        une_con: ''
      descripcion:
        tipo: VARCHAR
        distintos: 282
        descripcion: 'Nombre del producto. No es único: 24 nombres se repiten en 2 o 3 SKU que solo difieren en precio_lista (Perfumería, Lácteos, Limpieza y Bebidas). Filtrar siempre por sku; si piden un producto por nombre, sumar todos sus SKU o aclarar.'
        une_con: ''
      marca:
        tipo: VARCHAR
        distintos: 31
        descripcion: 'Marca comercial.'
        une_con: ''
      proveedor_id:
        tipo: VARCHAR
        distintos: 16
        descripcion: 'Proveedor que lo abastece.'
        une_con: ''
      categoria:
        tipo: VARCHAR
        valores: de la base
        descripcion: 'Una de 6: Almacén, Bebidas, Frescos, Limpieza, Lácteos, Perfumería.'
        une_con: ''
      subcategoria:
        tipo: VARCHAR
        distintos: 27
        descripcion: 'Agrupación dentro de la categoría.'
        une_con: ''
      precio_lista:
        tipo: DOUBLE
        rango: de la base
        descripcion: 'Precio unitario en ARS, sin descuento.'
        une_con: ''
      es_marca_propia:
        tipo: BOOLEAN
        descripcion: 'true solo para la marca Del Sur.'
        une_con: ''
  promociones:
    tipo: dimension
    alias: pm
    grano: ''
    join: ''
    descripcion: 'Promociones: un descuento sobre un SKU, en todas las sucursales, entre dos fechas. Es la única fuente de descuentos: las ventas sin promoción no tienen descuento. Una superposición: P0137 tiene PROMO124 y PROMO053 el 03 y 04-06-2024; esos días las ventas llevan PROMO124.'
    columnas:
      promocion_id:
        tipo: VARCHAR
        distintos: 133
        descripcion: 'Código (PROMO001…PROMO133). Lo llevan las ventas con descuento; las devoluciones nunca.'
        une_con: ''
      nombre:
        tipo: VARCHAR
        distintos: 119
        descripcion: 'Nombre comercial (''Promo Yogur 05/2024''). No es único: hay nombres repetidos en promociones de distinto SKU (12 al armar la base). Filtrar siempre por promocion_id.'
        une_con: ''
      sku:
        tipo: VARCHAR
        distintos: 104
        descripcion: 'Producto en promoción, uno por promoción.'
        une_con: productos.sku
      descuento_pct:
        tipo: DOUBLE
        rango: de la base
        descripcion: '% de descuento sobre el precio: 10, 15, 20 o 25.'
        une_con: ''
      fecha_desde:
        tipo: DATE
        rango: de la base
        descripcion: 'Primer día de vigencia (incluido).'
        une_con: ''
      fecha_hasta:
        tipo: DATE
        rango: de la base
        descripcion: 'Último día de vigencia (incluido). Duran de 7 a 31 días.'
        une_con: ''
  proveedores:
    tipo: dimension
    alias: pr
    grano: ''
    join: ''
    descripcion: 'Proveedores: 16. Casi todos abastecen una sola categoría; PR16 es la marca propia Del Sur y está en las 6.'
    columnas:
      proveedor_id:
        tipo: VARCHAR
        distintos: 16
        descripcion: 'Código (PR01…PR16).'
        une_con: ''
      nombre:
        tipo: VARCHAR
        distintos: 16
        descripcion: 'Razón social.'
        une_con: ''
  stock_semanal:
    tipo: hecho
    alias: st
    grano: semana x sucursal x producto
    join: stock_semanal st JOIN fechas f ON st.semana = f.fecha JOIN productos p ON st.sku = p.sku JOIN sucursales s ON st.sucursal_id
      = s.sucursal_id JOIN proveedores pr ON p.proveedor_id = pr.proveedor_id
    descripcion: 'Foto semanal del stock por sucursal y SKU. Solo están los pares sucursal × SKU que se venden (7.954 de 12.320). 0 = quiebre.'
    columnas:
      semana:
        tipo: DATE
        rango: de la base
        descripcion: 'Lunes de la semana.'
        une_con: ''
      sucursal_id:
        tipo: VARCHAR
        distintos: 40
        descripcion: 'Sucursal. S39 desde 02-06-2025 y S40 desde 07-07-2025.'
        une_con: ''
      sku:
        tipo: VARCHAR
        distintos: 308
        descripcion: 'Producto.'
        une_con: ''
      stock_unidades:
        tipo: INTEGER
        rango: de la base
        descripcion: 'Unidades en stock, nunca negativas.'
        une_con: ''
  sucursales:
    tipo: dimension
    alias: s
    grano: ''
    join: ''
    descripcion: 'Las 40 sucursales, 10 por región. Ninguna cerró.'
    columnas:
      sucursal_id:
        tipo: VARCHAR
        distintos: 40
        descripcion: 'Código (S01, S02…).'
        une_con: ''
      nombre:
        tipo: VARCHAR
        distintos: 40
        descripcion: 'Nombre de la sucursal.'
        une_con: ''
      region:
        tipo: VARCHAR
        valores: de la base
        descripcion: 'Centro, Norte, Oeste o Sur.'
        une_con: ''
      formato:
        tipo: VARCHAR
        valores: de la base
        descripcion: 'express (252–459 m²), super (1.312–2.559 m²) o hiper (6.324–7.899 m²).'
        une_con: ''
      superficie_m2:
        tipo: BIGINT
        rango: de la base
        descripcion: 'Superficie de venta en m².'
        une_con: ''
      fecha_apertura:
        tipo: DATE
        rango: de la base
        descripcion: 'Define si es comparable: una sucursal que abrió dentro del período comparado no lo es. Al armar la base, solo S39 (02-06-2025) y S40 (01-07-2025), ambas del Oeste, habían abierto dentro del período: no son comparables en el AF2026.'
        une_con: ''
  ventas:
    tipo: hecho
    alias: v
    grano: fecha x sucursal x producto x tipo de movimiento
    join: ventas v JOIN fechas f ON v.fecha = f.fecha JOIN productos p ON v.sku = p.sku JOIN sucursales s ON v.sucursal_id
      = s.sucursal_id JOIN proveedores pr ON p.proveedor_id = pr.proveedor_id
    descripcion: 'Movimientos diarios: una fila por fecha, sucursal, producto y tipo (venta o devolución). Importes en ARS constantes (reexpresados a la fecha de la última ingesta), sin impuestos.'
    columnas:
      fecha:
        tipo: DATE
        rango: de la base
        descripcion: 'Día del movimiento.'
        une_con: ''
      sucursal_id:
        tipo: VARCHAR
        distintos: 40
        descripcion: 'Sucursal donde ocurrió.'
        une_con: ''
      sku:
        tipo: VARCHAR
        distintos: 308
        descripcion: 'Producto.'
        une_con: ''
      tipo_movimiento:
        tipo: VARCHAR
        valores: de la base
        descripcion: '''venta'' o ''devolucion''. Las devoluciones van con unidades, importes y costo negativos.'
        une_con: ''
      unidades:
        tipo: BIGINT
        rango: de la base
        descripcion: 'Unidades vendidas (negativas si es devolución).'
        une_con: ''
      importe_bruto:
        tipo: DOUBLE
        rango: de la base
        descripcion: 'Unidades × precio de lista, antes del descuento.'
        une_con: ''
      descuento:
        tipo: DOUBLE
        rango: de la base
        descripcion: 'Descuento por promoción. Solo existe si hay promocion_id.'
        une_con: ''
      importe_neto:
        tipo: DOUBLE
        rango: de la base
        descripcion: 'importe_bruto - descuento. Base de «ventas».'
        une_con: ''
      costo:
        tipo: DOUBLE
        rango: de la base
        descripcion: 'Costo total de las unidades (no unitario), de reposición vigente ese día.'
        une_con: ''
      promocion_id:
        tipo: VARCHAR
        distintos: 133
        nulos: 2774003
        descripcion: 'Promoción aplicada; vacío si no hubo.'
        une_con: promociones.promocion_id
dimensiones:
  fecha: f.fecha
  anio: f.anio
  mes: f.mes
  anio_fiscal: f.anio_fiscal
  trimestre_fiscal: f.trimestre_fiscal
  mes_fiscal: f.mes_fiscal
  semana: f.semana_inicio
  sucursal: s.sucursal_id
  nombre_sucursal: s.nombre
  region: s.region
  formato: s.formato
  categoria: p.categoria
  subcategoria: p.subcategoria
  marca: p.marca
  producto: p.sku
  es_marca_propia: p.es_marca_propia
  proveedor: pr.proveedor_id
  nombre_proveedor: pr.nombre
nota_dimensiones: presupuesto solo se puede abrir por fecha (mes o más), sucursal, región, formato y categoría.
