# Lo que tiene que decir cada informe que se mide (I1, I2, I3), para calificarlos con código y no leyéndolos.
# Cada chequeo mira el texto del informe (título, bajada y razones) que quedó en su informe.json:
#   texto: la expresión aparece en algún lado · titulo: aparece en el título · titulo_sin: NO aparece en el título
#   cifra: alguno de los valores está escrito, con su tolerancia (se compara sin signo: «bajó 0,24 pp» o «−0,24 pp»)
# Los valores se verificaron con SQL directo el 2026-11-20; los hallazgos son los de esperados.yaml (P13, P15) y el
# aviso de presupuesto sospechoso (decisión 84). Son de trabajo, no de la reserva: se puede ajustar mirándolos.
