    - - {medida: unidades, tipo: valor, esperado: 8018, tolerancia: 0}   # P0071, cola Cola Andina 2,25 L (la común)
    - []   # promociones de gaseosas vigentes en dic-2025: solo PROMO001 (necesita consultar_sql)
C5:
