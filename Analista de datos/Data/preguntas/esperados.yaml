# Valores esperados de las preguntas de semana 1, verificados a mano con SQL directo (card «chequeos»).
# Cada pregunta tiene uno o más chequeos. Uno pasa si alguna consulta del agente usó esa medida y dio ese valor.
#   tipo: valor (un número) · variacion (comparar_con; en % o pp) · ranking (códigos en orden) · grupo (una fila de
#         un agrupado) · lecturas (ambigua) · sin_dato (decisión 76). margen_pct también se acepta de efectos_margen.
#   Además, las consultas que declara la respuesta, vueltas a correr, tienen que dar su valor (decisión 75).
#   tolerancia: la mitad del último dígito con que se verificó el valor
P01:
  - {medida: ventas_netas, tipo: valor, esperado: 9747823869, tolerancia: 0.5}
P02:
  - {medida: unidades, tipo: valor, esperado: 34186, tolerancia: 0.5}
P03:
  - {medida: margen_bruto, tipo: valor, esperado: 460758207, tolerancia: 0.5}
P04:
  - {medida: descuentos, tipo: valor, esperado: 9084031.50, tolerancia: 0.005}
P05:
  - {medida: sucursales_abiertas, tipo: valor, esperado: 10, tolerancia: 0}
P06:
  - {medida: ventas_netas, tipo: variacion, comparables: false, esperado: 5.4, tolerancia: 0.05}
  - {medida: ventas_netas, tipo: variacion, comparables: true, esperado: 2.3, tolerancia: 0.05}
P07:
  - {medida: margen_pct, tipo: variacion, comparables: false, esperado: -1.2, tolerancia: 0.05}
P08:
  - {medida: ventas_netas, tipo: variacion, comparables: true, esperado: 2.1, tolerancia: 0.05}
P10:
  - {medida: ventas_netas, tipo: ranking, dimension: sucursal, esperado: [S02, S11, S21, S01, S22]}
P11:
  - {medida: margen_bruto, tipo: ranking, dimension: proveedor, esperado: [PR11, PR15, PR07]}
# Semana 2. Ambigua (decisión 76, como el enunciado): pasa si consultó las dos lecturas, o si consultó una y la
# declaró en supuestos; nunca si eligió una en silencio.
P17:
  - {medida: ventas_netas, tipo: lecturas, esperados: [2514025456.5, 2632210699.5], tolerancia: 0.5}   # fiscal: T4 AF2026 (feb–abr 2026) · calendario: ene–mar 2026
# Sin dato en la base (decisión 76, como el enunciado): pasa si dice que no está y no responde con otro número (sin
# valor en el registro ni cifras de sus consultas en el texto). Una consulta que no usa es un aviso, no una falla.
P20:
  - {tipo: sin_dato}

# Hallazgos de los diagnósticos (semana 3), todavía sin chequeo automático.
# Estaban en las descripciones de esquema.yaml; se movieron acá para no darle la respuesta al agente (decisión 24).
#   P13 y C2: desde ago-2025 el costo de PR01 (Molinos del Plata) sube de ~74 % a ~83 % del precio de lista,
#             sin cambio de precio: baja el margen de Almacén (~25,9 % a ~24,4 %).
#   P15:      desde jun-2025 (apertura de S39) las comparables del Oeste caen ~6 % interanual,
#             mientras las otras regiones crecen 3–5 %.
#   P16:      la única promoción del 25 % es PROMO001 «Verano Cola Andina» (dic-2025).

# Conversaciones (semana 2): un chequeo por turno, verificados con SQL directo el 2026-11-11.
# Un turno pasa si alguna de SUS consultas cumple; así se ve si heredó período, filtros y medida.
#   grupo: la consulta agrupó por `dimension` y la fila de `codigo` tiene esa variación
#   fila: si Haiku agrupa en vez de filtrar, vale el número de esa fila (y solo de esa)
#   Un turno sin chequeos ([]) se corre igual, pero no se evalúa con números.
C1:
  turnos:
    - - {medida: ventas_netas, tipo: variacion, comparables: false, esperado: 5.4, tolerancia: 0.05}
      - {medida: ventas_netas, tipo: variacion, comparables: true, esperado: 2.3, tolerancia: 0.05}
    - - {medida: ventas_netas, tipo: variacion, comparables: false, esperado: 3.7, tolerancia: 0.05, fila: {region: Sur}}
    # en el Sur el orden difiere del total (ahí Gaseosas es segunda): si pierde la región, falla
    - - {medida: ventas_netas, tipo: ranking, dimension: subcategoria, esperado: [Vinos, Jugos, Cervezas, Gaseosas, Aguas]}
C2:
  turnos:
    - - {medida: margen_pct, tipo: valor, esperado: 24.5, tolerancia: 0.05, fila: {categoria: Almacén}}
    - - {medida: margen_pct, tipo: valor, esperado: 25.7, tolerancia: 0.05, fila: {categoria: Almacén}}
    - - {medida: margen_pct, tipo: grupo, dimension: proveedor, codigo: PR01, esperado: -8.6, tolerancia: 0.05}
C3:
  turnos:
    - - {medida: ventas_netas, tipo: valor, esperado: 1940176821.5, tolerancia: 0.5}
    - - {medida: ventas_netas, tipo: variacion, comparables: false, esperado: 6.3, tolerancia: 0.05}
    - - {medida: ventas_netas, tipo: variacion, comparables: true, esperado: -5.7, tolerancia: 0.05}
C4:
  turnos:
    - - {medida: unidades, tipo: valor, esperado: 1806, tolerancia: 0}   # P0298, cola Del Sur 2,25 L
    - - {medida: unidades, tipo: valor, esperado: 8018, tolerancia: 0, fila: {producto: P0071}}   # P0071, cola Cola Andina 2,25 L (la común); a veces agrupa sus 3 sku de igual nombre
    - []   # promociones de gaseosas vigentes en dic-2025: solo PROMO001 (necesita consultar_sql)
C5:
  turnos:
    - []   # ambigua: tiene que preguntar o dar las dos lecturas (fiscal 2.514.025.456,5 · calendario 2.632.210.699,5)
    - - {medida: ventas_netas, tipo: valor, esperado: 2514025456.5, tolerancia: 0.5}
    - - {medida: margen_pct, tipo: valor, esperado: 26.6, tolerancia: 0.05}

# Tipos que tiene que reconocer la puerta (decisión 78), sin las apartadas. Diagnóstico e informe van al
# coordinador; el resto, al agente. En las conversaciones, «agente» = cualquier tipo que vaya al agente: en esos
# turnos se mide la ruta, no el tipo. `puerta.py --medir` clasifica solo estos casos, sin responderlos.
TIPOS:
  P01: puntual
  P02: puntual
  P03: puntual
  P04: puntual
  P05: puntual
  P06: comparativa
  P07: comparativa
  P08: comparativa
  P10: ranking
  P11: ranking
  P13: diagnostico
  P15: diagnostico
  P16: diagnostico
  P17: ambigua
  P20: sin_dato
  I1: informe
  I2: informe
  I3: informe
  C1: [comparativa, agente, agente]
  C2: [puntual, agente, agente]
  C3: [puntual, agente, agente]
  C4: [puntual, agente, agente]
  C5: [ambigua, agente, agente]
